name: 🎙️ Morning Call Jabali

# ─── Gatilho ─────────────────────────────────────────────────────────────────
# O agendamento é feito externamente via cron-job.org (6:17 AM BRT, seg–sex)
# que dispara este workflow via HTTP POST na API do GitHub.
# Isso garante pontualidade independente do estado da fila do GitHub Actions.
on:
  # Gatilho via API externa (cron-job.org) ou manual pelo painel do GitHub
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo do disparo (opcional)'
        required: false
        default: 'Disparo automático via cron-job.org'

# ─── Permissões ───────────────────────────────────────────────────────────────
permissions:
  contents: write   # necessário para fazer commit do MP3 e feed.xml

# ─── Job principal ────────────────────────────────────────────────────────────
jobs:
  gerar-podcast:
    name: Gerar e publicar episódio
    runs-on: ubuntu-latest
    timeout-minutes: 30   # aborta se travar por mais de 30 min
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # evita aviso de depreciação

    steps:

      # 1. Baixar o código do repositório
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2. Python 3.11
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Dependências Python
      - name: 📦 Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Google Chrome (para Selenium + paywall do Valor)
      - name: 🌐 Instalar Google Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          echo "Chrome: $(google-chrome --version)"

      # 5. Escrever cookies do Valor (armazenados como Secret)
      - name: 🍪 Preparar cookies do Valor Econômico
        run: |
          echo '${{ secrets.VALOR_COOKIES_JSON }}' > valor_cookies.json
          echo "✅ Cookies prontos"

      # 5b. Aprender com as manchetes favoritas (Planilha Google) e refinar o perfil
      - name: 🧠 Aprender com manchetes favoritas
        continue-on-error: true   # aprendizado é opcional; nunca quebra o episódio
        env:
          FAVORITAS_CSV_URL: ${{ secrets.FAVORITAS_CSV_URL }}
        run: python sincronizar_favoritas.py

      # 5c. Commitar de volta o perfil aprendido (histórico = backup)
      - name: 💾 Salvar perfil aprendido
        continue-on-error: true
        run: |
          git config user.name  "morning-call-bot"
          git config user.email "morning-call-bot@users.noreply.github.com"
          git add -- perfil_interesses.json manchetes_processadas.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no perfil — nada a commitar."
          else
            git commit -m "🧠 Aprendizado automático do perfil de interesses"
            git push
          fi

      # 6. Executar o pipeline completo
      - name: 🚀 Executar pipeline
        env:
          ELEVENLABS_API_KEY:      ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:     ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL:        ${{ secrets.ELEVENLABS_MODEL }}
          ELEVENLABS_LANGUAGE_CODE: ${{ secrets.ELEVENLABS_LANGUAGE_CODE }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_USUARIO:         rjabali746
          GH_REPO:            morning-call-podcast
          GH_PAGES_URL:       https://rjabali746.github.io/morning-call-podcast
        run: python pipeline_completo.py

      # 7. Salvar log como artefato em caso de falha (útil para diagnóstico)
      - name: 📋 Salvar log de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: pipeline.log
          retention-days: 14
